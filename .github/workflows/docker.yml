name: Docker & GHCR Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web frontend
        run: npm run build

      - name: Run server tests
        run: npm test

  docker:
    name: Build, Verify & Publish Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: azdo-board:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container in demo mode
        run: |
          docker run -d --rm --name azdo-board-smoke -e AZDO_DEMO=1 -p 127.0.0.1:3001:3001 azdo-board:smoke-test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3001/api/meta > /dev/null; then
              echo "Container is up and responding on /api/meta"
              curl -fsS http://127.0.0.1:3001/ > /dev/null
              docker stop azdo-board-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs azdo-board-smoke
          docker stop azdo-board-smoke
          exit 1

      - name: Publish Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
