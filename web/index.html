<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230052CC'/><path d='M9 16l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Board</title>
    <script>
      try {
        const rawTheme = JSON.parse(localStorage.getItem('azdo-board:theme') || '"system"');
        const palette = JSON.parse(localStorage.getItem('azdo-board:palette') || '"default"');
        const isPurple = palette === 'purple' || rawTheme === 'purple';
        const pref = rawTheme === 'purple' ? 'system' : rawTheme;
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = pref === 'dark' || (pref !== 'light' && sysDark);
        document.documentElement.dataset.theme = isPurple ? (dark ? 'purple-dark' : 'purple') : dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
